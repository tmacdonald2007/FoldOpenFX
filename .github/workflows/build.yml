name: Build FoldOpenFX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract latest FoldOpenFX project ZIP
        run: |
          ZIP="$(ls -1 FoldOpenFX-project-*.zip 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No FoldOpenFX project ZIP found."
            exit 1
          fi
          echo "Using $ZIP"
          unzip -o "$ZIP" -d .
          echo "Project files:"
          ls -la
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -d app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldOpenFX-debug
          path: app/build/outputs/apk/debug/app-debug.apk
